<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এন্ট্রি ফরম</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; padding: 20px; }
    .form-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #aaa; }
    #msg { margin-top: 15px; }
  </style>
</head>
<body>
  <div class="form-card">
    <h2>আবেদন ফরম</h2>
    <form id="entryForm">
      <!-- ফরম ফিল্ডগুলো JS দিয়ে জেনারেট হবে -->
    </form>
    <div id="msg"></div>
  </div>

  <script>
    // Google Apps Script ওয়েব অ্যাপ URL (আপনার স্ক্রিপ্ট ডেপ্লয়মেন্ট URL বসান)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzam26Vc-gDY-2m5G2u6ikJ6XsxKvM-p30ntLPZ7Q7w-Ujhm1EOpz3e7nMafXrqtJbGuw/exec';

    // ফিল্ডের কনফিগারেশন (JSON)
    const formFields = [
      { key: 'serial', label: 'সিরিয়াল', type: 'text' },
      { key: 'date', label: 'তারিখ', type: 'date' },
      { key: 'name', label: 'নাম', type: 'text' },
      { key: 'father', label: 'পিতার নাম', type: 'text' },
      { key: 'nid', label: 'এন.আই.ডি.', type: 'text' },
      { key: 'dob', label: 'জন্মতারিখ', type: 'date' },
      { key: 'mobile', label: 'মোবাইল', type: 'tel' },
      { key: 'address', label: 'ঠিকানা', type: 'text' },
      { key: 'vehicle_type', label: 'যানবাহনের ধরন', type: 'text' },
      { key: 'number_plate', label: 'নম্বর প্লেট', type: 'text' },
      { key: 'engine', label: 'ইঞ্জিন নম্বর', type: 'text' },
      { key: 'chassis', label: 'চ্যাসিস নম্বর', type: 'text' },
      { key: 'model', label: 'মডেল', type: 'text' },
      { key: 'cc', label: 'সি.সি.', type: 'number' },
      { key: 'color', label: 'রঙ', type: 'text' },
      { key: 'total', label: 'টোটাল', type: 'number' },
      { key: 'cash', label: 'ক্যাশ', type: 'number' },
      { key: 'due', label: 'বাকি', type: 'number' }
    ];

    const form = document.getElementById('entryForm');

    // ফর্ম ফিল্ড জেনারেট
    formFields.forEach(field => {
      const group = document.createElement('div');
      group.className = 'form-group';

      const label = document.createElement('label');
      label.htmlFor = field.key;
      label.textContent = field.label;

      const input = document.createElement('input');
      input.type = field.type;
      input.id = field.key;
      input.name = field.key;
      if (field.type === 'date') input.max = new Date().toISOString().split('T')[0];

      group.appendChild(label);
      group.appendChild(input);
      form.appendChild(group);
    });

    // সাবমিশন হ্যান্ডলার
    form.addEventListener('submit', e => {
      e.preventDefault();
      const data = {};
      formFields.forEach(f => {
        data[f.key] = document.getElementById(f.key).value;
      });

      // POST to Google Apps Script
      fetch(SCRIPT_URL, {
	  method: 'POST',
      headers: {
      'Content-Type': 'application/json'
     },
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(res => {
    if (res.result === 'success') {
     document.getElementById('msg').innerText = 'সফলভাবে জমা হয়েছে';
    } else {
     document.getElementById('msg').innerText = 'ভুল হয়েছে: ' + res.message;
     }
    })
    .catch(err => {
    document.getElementById('msg').innerText = 'নেটওয়ার্ক ত্রুটি: ' + err.message;
    });
    });

    // সাবমিট বাটন যোগ
    const submitBtn = document.createElement('button');
    submitBtn.textContent = 'জমা করুন';
    submitBtn.type = 'submit';
    form.appendChild(submitBtn);
  </script>
</body>
</html>
